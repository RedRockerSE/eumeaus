[workspace]
resolver = "2"
members = [
    "crates/eumeaus-engine",
    "crates/eumeaus-plugin-host",
    "crates/eumeaus-plugin-protocol",
    "crates/eumeaus-plugin-sdk",
    "crates/eumeaus-username-search-plugin",
    "crates/eumeaus-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/magjon/eumeaus"
publish = false

[workspace.dependencies]
eumeaus-engine = { path = "crates/eumeaus-engine" }
eumeaus-plugin-host = { path = "crates/eumeaus-plugin-host" }
eumeaus-plugin-protocol = { path = "crates/eumeaus-plugin-protocol" }
eumeaus-plugin-sdk = { path = "crates/eumeaus-plugin-sdk" }

thiserror = "1.0.65"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
serde = { version = "1.0.210", features = ["derive"] }
clap = { version = "4.5.20", features = ["derive"] }

# M3: plugin protocol/host (gRPC over a local Unix domain socket, per
# SPEC.md §2.2/§3.2, modeled on HashiCorp go-plugin).
tonic = "0.12.3"
prost = "0.13.5"
tokio = "1.53.1"
tokio-stream = "0.1.19"
# Pinned to the exact version tonic 0.12.3 itself depends on (^0.4.7) so
# only one `tower` version resolves — a direct 0.5.x pin would deadlock
# trait resolution against tonic's `Service`/`service_fn` types.
tower = "0.4.7"
hyper-util = "0.1.20"
toml = "1.1.4"
semver = "1.0.28"
# Local trust store (SPEC.md §8 open question 2) — resolves the OS config
# directory for trusted_keys.toml.
dirs = "5.0.1"
sha2 = "0.10.9"
base64 = "0.23.1"
ed25519-dalek = "2.1.1"
async-trait = "0.1.92"
serde_json = "1.0.151"

# M5: username-search PoC plugin. Async client (not "blocking") since
# PluginRuntime::check is async — see eumeaus-plugin-sdk's note on why.
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls"] }
wiremock = "0.6.5"

# M6: credential management (interactive `credential set` prompt).
rpassword = "7.5.4"

[profile.dev]
debug = 1
