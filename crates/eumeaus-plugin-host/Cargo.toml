[package]
name = "eumeaus-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eumeaus-plugin-protocol.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
keyring = "4.1.6"
semver.workspace = true
sha2.workspace = true
base64.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
dirs.workspace = true
tempfile = "3.13.0"
tonic.workspace = true
tower.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "process",
    "net",
    "time",
    "macros",
    "io-util",
] }
tokio-stream = { workspace = true, features = ["net"] }

[dev-dependencies]
# Only used to build examples/stub_*.rs (the test-fixture plugins) —
# examples aren't compiled by plain `cargo build`, only by `cargo test`
# (or `cargo build --examples`), so this never leaks into a production
# build of the host.
eumeaus-plugin-sdk.workspace = true
async-trait.workspace = true
rand = "0.8.7"
