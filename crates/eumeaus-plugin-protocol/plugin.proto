syntax = "proto3";

package eumeaus.plugin.v1;

// Wire contract between eumeaus-engine (via eumeaus-plugin-host) and plugin
// subprocesses. Single source of truth both sides compile against.
//
// Compiled by build.rs (tonic-build, via a vendored protoc so no system
// install is required) into $OUT_DIR, then pulled in by
// `tonic::include_proto!("eumeaus.plugin.v1")` in src/lib.rs.

service PluginRuntime {
  rpc Describe(DescribeRequest) returns (DescribeResponse);
  rpc Check(CheckRequest) returns (stream CheckResult);
}

message DescribeRequest {}

message DescribeResponse {
  string plugin_name = 1;
  string plugin_version = 2;
}

message CheckRequest {
  string scan_id = 1;
  string input_entity_type = 2;
  string input_value = 3;
  map<string, string> resolved_credentials = 4;
  RateLimitConfig rate_limit = 5;
}

message RateLimitConfig {
  uint32 requests_per_sec = 1;
  uint32 timeout_ms = 2;
}

enum ConfidenceStatus {
  CONFIDENCE_STATUS_UNSPECIFIED = 0;
  FOUND = 1;
  NOT_FOUND = 2;
  UNCERTAIN = 3;
  ERROR = 4;
}

message CheckResult {
  ConfidenceStatus status = 1;
  repeated EntityFinding entities = 2;
  repeated RelationshipFinding relationships = 3;
  Provenance provenance = 4;
  string error_message = 5;
}

message EntityFinding {
  string entity_type = 1;
  string canonical_key = 2;
  string display_label = 3;
  map<string, string> attributes = 4;
}

message RelationshipFinding {
  string from_canonical_key = 1;
  string to_canonical_key = 2;
  string relationship_type = 3;
}

message Provenance {
  string source_url = 1;
  string retrieval_method = 2;
  string raw_response_sha256 = 3;
  int64 collected_at_unix_ms = 4;
  string plugin_name = 5;
  string plugin_version = 6;
}
