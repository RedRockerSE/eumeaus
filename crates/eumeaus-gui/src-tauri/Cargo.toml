[package]
name = "eumeaus-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Eumeaus GUI (Tauri) — SPEC.md §9"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eumeaus_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
eumeaus-engine.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
# G3's scan-progress channel (scan_state.rs) — tauri itself uses tokio
# internally, but doesn't re-export it, so this is needed directly to
# name tokio::sync::mpsc's types.
tokio = { workspace = true, features = ["sync"] }
# G5's plugin_verify (plugin_state.rs) needs to build a raw hex trusted
# key into a VerifyingKey the same way eumeaus-cli's parse_hex_key does.
ed25519-dalek.workspace = true
# G6 (SPEC.md §9.4/§9.6, resolves §8.8): framework-native updater. Its
# minisign-style Ed25519 signing keypair is separate from this plugin's
# own (plugin-manifest signing) and from case export's report-signing
# key — SPEC.md §9.4 calls out that this is deliberate, not an oversight.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3.13.0"
uuid.workspace = true
# report_state.rs's sign/verify round-trip test needs to generate a real
# signing key — same version eumeaus-cli's own dev-deps pin.
rand = "0.8.7"
ed25519-dalek = { workspace = true, features = ["rand_core"] }

