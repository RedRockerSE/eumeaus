[package]
name = "eumeaus-plugin-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
eumeaus-plugin-protocol.workspace = true
thiserror.workspace = true
tonic.workspace = true
# "sync" (mpsc channel) backs the Windows named-pipe accept loop in
# serve_named_pipe — its ServerOptions::create/connect API has no
# UnixListenerStream-style ready-made Stream wrapper, so a background task
# bridges it into one via a channel. See lib.rs's module doc.
tokio = { workspace = true, features = ["net", "io-std", "io-util", "sync"] }
tokio-stream = { workspace = true, features = ["net", "sync"] }
async-trait.workspace = true
