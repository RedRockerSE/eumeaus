[package]
name = "eumeaus-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
# vendored-openssl (not plain bundled-sqlcipher): statically links a
# from-source-built OpenSSL into the binary instead of the system's
# libcrypto.so/.dll — a release binary built with plain bundled-sqlcipher
# dynamically links the *build machine's* OpenSSL, which breaks on any
# end-user machine without a compatible version installed. Confirmed via
# `ldd` before this change (libcrypto.so.3 was there; it isn't after).
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
keyring = "4.1.6"
getrandom = "0.4.3"
eumeaus-plugin-host.workspace = true
ed25519-dalek.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3.13.0"
# Only used to build examples/scan_*.rs (test-fixture plugins for M4's
# scan-orchestration tests) — examples aren't compiled by plain
# `cargo build`, only by `cargo test`, so this never leaks into a
# production build. See eumeaus-plugin-host/Cargo.toml for the same
# pattern, explained in more detail.
eumeaus-plugin-sdk.workspace = true
eumeaus-plugin-protocol.workspace = true
async-trait.workspace = true
# Only for plugins.rs's own tests, which sign a fixture manifest to
# exercise engine::plugins::verify end to end.
rand = "0.8.7"
ed25519-dalek = { workspace = true, features = ["rand_core"] }
