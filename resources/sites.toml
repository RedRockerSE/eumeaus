# Converted from the Sherlock project's data.json (https://github.com/sherlock-project/sherlock/blob/master/sherlock_project/resources/data.json).
#
# NOT wired into any build — a plain reference resource, not consumed by eumeaus-username-search-plugin or any CI step. To actually use it, copy/rename it to sites.toml next to that plugin's plugin.toml, or point EUMEAUS_USERNAME_SEARCH_SITES_FILE at it.
#
# Sherlock's data.json is a strictly richer format than this plugin's Detection enum (StatusCode / BodyMarkerMeansNotFound(marker)) supports, so this is a lossy, best-effort conversion:
#  - 27 sites skipped entirely: errorType "response_url" (redirect-target-based detection) has no equivalent here.
#  - 22 sites skipped entirely: the {} placeholder sits in the subdomain (e.g. https://{}.example.com), and path_template can only substitute within the path, not the host.
#  - 3 sites skipped entirely: no substitutable path found.
#  - 0 sites skipped entirely: errorType "message" with no usable errorMsg string.
#  - Every kept "message"-detection site with an errorMsg *array* (multiple alternative not-found markers, e.g. rate-limit vs. genuinely-not-found) keeps only the first string — not_found_marker takes exactly one.
#  - Sherlock's regexCheck (username format pre-validation), request_method/ request_payload (POST probes), custom headers, urlProbe (a separate check URL from the display URL), isNSFW, and a site-specific errorCode other than 404 (e.g. Sherlock's own "Slides" entry expects 204) all have no equivalent and are silently dropped — every kept site here is checked with a plain GET against base_url + path_template.
#
# 429 sites converted; see the counts above for what didn't make it.

